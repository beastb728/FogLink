# fly.toml app configuration file generated for foglink-relay on 2026-11-11T00:39:40+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'foglink-relay'
primary_region = 'sin'

[build]
  dockerfile = 'server/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256

[env]
  FOGLINK_CLIENT_IP_HEADER = "Fly-Client-IP" # per-address connection cap sees the phone, not Fly's proxy
